const lvOf=(p,n)=>(p.skills.find(s=>s.n===n)||{l:0}).l;
function careersFor(p){return Object.values(CR).filter(c=>c.f.includes(p.field))}
const MC=new Map();const sig=p=>p.field+'|'+p.skills.map(x=>x.n+x.l).join(',')+'|'+(p.interests||'')+'|'+(p.goal||'');
function memo(k,fn){if(MC.size>400)MC.clear();if(!MC.has(k))MC.set(k,fn());return MC.get(k)}
function fit(p,c){return memo('f'+c.id+sig(p),()=>_fit(p,c))}
function _fit(p,c){const need=Object.entries(c.req);let tot=0,got=0;const have=[],gap=[];need.forEach(([n,l])=>{tot+=l;const h=lvOf(p,n);got+=Math.min(h,l);h>=l?have.push(n):gap.push({n,need:l,has:h})});const words=(p.interests||'').toLowerCase()+' '+(p.goal||'').toLowerCase();const int=c.t.toLowerCase().split(/[ /,]+/).some(w=>w.length>3&&words.includes(w))?6:0;const s=Math.min(100,Math.round(got/tot*84+(c.f[0]===p.field?10:5)+int));return{s,have,gap,int,label:s>=72?'Strong alignment':s>=50?'Good alignment':'Potential pathway'}}
function ranked(p){return memo('r'+sig(p),()=>careersFor(p).map(c=>({c,m:fit(p,c)})).sort((a,b)=>b.m.s-a.m.s))}
function target(p){return CR[p.target]&&CR[p.target].f.includes(p.field)?CR[p.target]:null}

function choose(id){S.p.target=id;save();render();toast('Career chosen: '+CR[id].t)}
function resumeKw(p,c){const t=(p.resume?p.resume.text:'').toLowerCase();const kws=[...Object.keys(c.req),...c.pref];return{hit:kws.filter(k=>t.includes(k.toLowerCase().split(' (')[0])),miss:kws.filter(k=>!t.includes(k.toLowerCase().split(' (')[0]))}}
function profComp(p){const v=[p.name,p.field,p.degree,p.spec,p.year||p.prior,p.exp!==undefined,p.loc,p.work,p.skills.length,p.goal];return Math.round(v.filter(Boolean).length/v.length*100)}
function readiness(p,c){const m=fit(p,c);let tot=0,got=0,pr=0,pc=0;Object.entries(c.req).forEach(([k,l])=>{tot+=l;const h=lvOf(p,k);got+=Math.min(h,l);if(h){pc++;pr+=Math.min(1,h/l)}});const sm=Math.round(got/tot*100),prf=pc?pr/pc:0,exp=Math.min(1,(+p.exp||0)/2),n=Object.keys(p.iv||{}).filter(k=>k.startsWith(c.id+':')).length,pcm=profComp(p);const parts=[['Skill match',Math.round(sm*CFG.skill/100),CFG.skill],['Skill proficiency',Math.round(prf*CFG.prof),CFG.prof],['Experience',Math.round(exp*CFG.exp),CFG.exp],['Interview preparation',Math.round(n/5*CFG.iv),CFG.iv],['Profile completion',Math.round(pcm*CFG.prof2/100),CFG.prof2]];return{total:parts.reduce((a,x)=>a+x[1],0),parts,m,sm,pcm,ivp:n}}
function nextSteps(p,c){const m=fit(p,c);const s=[...m.gap].sort((a,b)=>(b.need-b.has)-(a.need-a.has)).slice(0,3).map(g=>g.has?`Raise ${g.n} from ${LV[g.has]} to ${LV[g.need]}`:`Start learning ${g.n} (target: ${LV[g.need]})`);if(!p.resume)s.push('Upload your resume to check alignment with this career');if(!s.length)s.push('Build a project that shows '+c.proj[0].toLowerCase());return s}
function roadmap(p,c){const st=[];const grp=l=>Object.entries(c.req).filter(([n,x])=>x===l||(l===3&&x>3));const mk=(t,items)=>({t,items});st.push(mk('Foundation',Object.entries(c.req).filter(([n,l])=>l<=2).map(([n,l])=>[n,Math.min(lvOf(p,n),2)>=Math.min(l,2)])));st.push(mk('Core skills',Object.entries(c.req).filter(([n,l])=>l===3).map(([n])=>[n,lvOf(p,n)>=3])));if(c.pref.length)st.push(mk('Complementary skills',c.pref.map(n=>[n,lvOf(p,n)>0])));st.push(mk('Projects & practical work',c.proj.map(x=>[x,false])));st.push(mk('Internship preparation',[['Tailor resume to '+c.t,!!p.resume],['Shortlist 10 sample roles in Jobs',(p.saved||[]).length>=3]]));st.push(mk('Interview preparation',c.qs.map(q=>[q[0],!!(p.done||{})[c.id+':'+q[0]]])));return st.filter(s=>s.items.length)}

const N=nodes.length,pts=[];nodes.forEach((n,i)=>{const y=1-2*(i+.5)/N,rad=Math.sqrt(1-y*y),th=i*2.399963,R=3.1,v=new T.Vector3(Math.cos(th)*rad*R,y*R,Math.sin(th)*rad*R);pts.push(new T.Vector3(0,0,0),v);const m=new T.Mesh(D(new T.SphereGeometry(n.own?.1+.06*n.l:.12,16,12)),D(new T.MeshBasicMaterial({color:n.own?0xe3a24f:0x9099a8,transparent:true,opacity:n.own?1:.35,wireframe:!n.own})));m.position.copy(v);grp.add(m);const l=lbl(n.n,n.own?'#eceef2':'#9099a8',1);l.position.copy(v).multiplyScalar(1.0).add(new T.Vector3(0,.34,0));grp.add(l)});
grp.add(new T.LineSegments(D(new T.BufferGeometry().setFromPoints(pts)),D(new T.LineBasicMaterial({color:0x9099a8,transparent:true,opacity:.18}))));

function skills(){const p=S.p,f=EDU[p.field];return`<h1>Skills</h1><p class="mu">Changes here update careers, readiness, jobs, roadmap and advisor answers.</p>

${recCard(p)}<h2>My skills</h2><p class="mu sm">Skills you added yourself. They stay when your education or career changes.</p><input id="sk_q" aria-label="Search your skills" placeholder="Search your skills" oninput="skList()" style="margin-bottom:12px"><div id="sl">${skItems('')}</div>`}
function recCard(p){const c=target(p),have=new Set(p.skills.map(s=>s.n)),req=c?Object.keys(c.req).concat(c.pref):[],rest=EDU[p.field].skl.filter(n=>!req.includes(n)),chip=n=>have.has(n)?'':`<button class="btn g" style="margin:3px" onclick="addRec('${n.replace(/'/g,"\\'")}')">+ ${esc(n)}</button>`,a=req.map(chip).join(''),b=rest.map(chip).join('');return`<div class="card"><h3>Recommended for ${EDU[p.field].n}</h3><p class="mu sm">Derived from your current education and chosen career. These are not stored as your skills until you add them.</p>${c?`<p class="sm"><b>Required for ${c.t}</b></p><div>${a||'<span class="mu sm">You have all of these.</span>'}</div>`:'<p class="sm mu">Choose a career in Careers to see career-specific skills.</p>'}<p class="sm"><b>Other skills in this field</b></p><div>${b||'<span class="mu sm">Nothing more to recommend.</span>'}</div></div>`}
function addRec(n){if(!S.p.skills.some(x=>x.n===n))S.p.skills.push({n,l:1,c:SK[n]||'Technical Skills'});save();render()}
function skItems(q){const p=S.p;const l=p.skills.filter(s=>s.n.toLowerCase().includes(q.toLowerCase()));if(!l.length)return`<div class="card mu">${p.skills.length?'No skills match your search.':'No skills yet. Add your first skill above.'}</div>`;return CATS.filter(c=>l.some(s=>s.c===c)).map(c=>`<div class="card"><h3>${c}</h3>${l.filter(s=>s.c===c).map(s=>`<div class="row sp" style="padding:5px 0"><span>${esc(s.n)}</span><span class="row"><select style="width:140px" onchange="setLv('${s.n.replace(/'/g,"\\'")}',+this.value)">${[1,2,3,4].map(x=>`<option value="${x}" ${x===s.l?'selected':''}>${LV[x]}</option>`).join('')}</select><button class="btn g" aria-label="Delete ${esc(s.n)}" onclick="delSk('${s.n.replace(/'/g,"\\'")}')">Delete</button></span></div>`).join('')}</div>`).join('')}
function skList(){$('sl').innerHTML=skItems($('sk_q').value)}
function addSk(){const n=$('sk_n').value.trim();if(!n){toast('Enter a skill name');return}const ex=S.p.skills.find(s=>s.n.toLowerCase()===n.toLowerCase());const c=SK[n]||$('sk_c').value;if(ex)ex.l=+$('sk_l').value;else S.p.skills.push({n:Object.keys(SK).find(k=>k.toLowerCase()===n.toLowerCase())||n,l:+$('sk_l').value,c});save();render();toast('Skill saved')}
function setLv(n,l){S.p.skills.find(s=>s.n===n).l=l;save();toast('Level updated')}
function delSk(n){S.p.skills=S.p.skills.filter(s=>s.n!==n);save();render()}

function calculateJobMatch(p,act,j,c,m){return Math.min(100,Math.round(m.s*.75+(act&&c.id===act.id?15:c.f.includes(p.field)?5:0)+(p.loc==='Anywhere'||j.loc===p.loc||j.loc==='Remote'?5:0)+(j.type===p.work?5:0)))}
function jobsFor(p){const act=target(p),cs=new Set(careersFor(p).map(c=>c.id));return JOBS.filter(j=>cs.has(j.c)).map(j=>{const c=CR[j.c],m=fit(p,c);return{...j,c:undefined,cr:c,m,jm:calculateJobMatch(p,act,j,c,m)}}).sort((a,b)=>b.jm-a.jm)}
function jobs(){const p=S.p;if(S.job)return jobDetail(S.job);const f=S.jf;
return`<h1>Jobs</h1><p class="mu">Sample listings for prototype use. They are not live vacancies; the data shape is ready for a job API.</p><div class="card"><div class="row"><div style="flex:2;min-width:160px"><input id="jq" placeholder="Search title or skill" value="${esc(f.q)}" oninput="S.jf.q=this.value;jList()"></div>${[['loc','Location',CITIES],['type','Job type',['Full-time','Part-time','Internship','Contract']],['exp','Experience',['Fresher','0–1 yrs','1–3 yrs','3–5 yrs','5+ yrs']]].map(([k,n,o])=>`<div style="flex:1;min-width:130px"><select onchange="S.jf.${k}=this.value;jList()"><option value="">${k==='loc'?'Anywhere':n+': any'}</option>${o.map(x=>`<option ${f[k]===x?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')}</div></div><div id="jl">${jItems()}</div>
${p.viewed.length?`<div class="card"><h3>Recently viewed</h3>${p.viewed.slice(0,4).map(id=>{const j=JOBS.find(x=>x.id===id);return j?`<button class="btn g" style="margin:2px" onclick="go('jobs','${id}')">${j.title}</button>`:''}).join('')}</div>`:''}`}
function jList(){$('jl').innerHTML=jItems()}
function jItems(){const p=S.p,f=S.jf,q=f.q.toLowerCase();const l=jobsFor(p).filter(j=>(!q||(j.title+Object.keys(j.cr.req).join(' ')).toLowerCase().includes(q))&&(!f.loc||j.loc===f.loc)&&(!f.type||j.type===f.type)&&(!f.exp||j.exp===f.exp));if(!l.length)return'<div class="card mu">No jobs match these filters. Clear a filter to see more roles for your background.</div>';
return`<div class="grid">${l.map(j=>`<div class="card"><div class="clk" onclick="go('jobs','${j.id}')"><b>${j.title}</b><p class="sm mu">${j.co} · ${j.loc}</p><p class="sm">${j.type} · ${j.exp}</p><p class="sm" style="color:var(--ac)">Job Match Score ${j.jm} / 100</p><p class="sm mu">Source: Sample data · Missing: ${j.m.gap.map(g=>g.n).slice(0,3).join(', ')||'none'}</p></div><button class="btn g" style="margin-top:8px" onclick="togSave('${j.id}')">${p.saved.includes(j.id)?'Saved ✓':'Save job'}</button></div>`).join('')}</div>`}
function togSave(id){const s=S.p.saved;const i=s.indexOf(id);i>=0?s.splice(i,1):s.push(id);save();render();toast(i>=0?'Removed from saved':'Job saved')}
function jobDetail(id){const p=S.p,j=jobsFor(p).find(x=>x.id===id);if(!j){S.job=null;return jobs()}p.viewed=[id,...p.viewed.filter(x=>x!==id)].slice(0,8);save();const c=j.cr;
return`<button class="btn g" onclick="S.job=null;render()">← All jobs</button><h1 style="margin-top:14px">${j.title}</h1><p class="mu">${j.co} · ${j.loc} · ${j.type} · ${j.exp}</p>${tg('Sample listing','ac')}<div class="two" style="margin-top:14px"><div class="card"><h3>Requirements</h3><p class="sm"><b>Education:</b> ${j.edu} in ${EDU[c.f[0]].n}</p><p class="sm"><b>Required skills:</b> ${Object.keys(c.req).map(n=>tg(n,lvOf(p,n)>=c.req[n]?'ok':'')).join('')}</p><p class="sm"><b>Preferred:</b> ${c.pref.map(n=>tg(n,lvOf(p,n)?'ok':'')).join('')||'—'}</p></div><div class="card"><h3>Why it matches</h3><p class="sm" style="color:var(--ac)">${j.m.label}</p><p class="sm"><b>You have:</b> ${j.m.have.map(n=>tg(n,'ok')).join('')||'—'}</p><p class="sm"><b>Missing:</b> ${j.m.gap.map(g=>tg(g.n,'no')).join('')||'None'}</p><p class="sm"><b>Preparation:</b> ${esc(nextSteps(p,c)[0])}</p></div></div><div class="row"><button class="btn" onclick="toast('Sample listing: a live job API would open the employer application page')">Apply on employer site</button><button class="btn g" onclick="togSave('${j.id}')">${p.saved.includes(j.id)?'Saved ✓':'Save job'}</button></div>${p.saved.length?`<div class="card" style="margin-top:14px"><h3>Saved jobs</h3>${p.saved.map(i=>{const x=JOBS.find(y=>y.id===i);return x?tg(x.title):''}).join('')}</div>`:''}`}

function resume(){const p=S.p,c=target(p),r=p.resume;if(!c)return'<h1>Resume</h1>'+nocareer('Choose a career from Careers to get resume feedback for that role.');
let h=`<h1>Resume</h1><p class="mu">Feedback is tailored to your target career: <b style="color:var(--ac)">${c.t}</b></p><div class="card"><div class="row"><input type="file" id="rf" accept=".txt,.md,.pdf,.doc,.docx" style="display:none" onchange="upRes(this.files[0])"><button class="btn" onclick="$('rf').click()">${r?'Replace resume':'Upload resume'}</button>${r?`<button class="btn g" onclick="viewRes()">View</button><button class="btn g" onclick="dlRes()">Download</button>`:''}</div>${r?`<p class="sm mu" style="margin-top:8px">${esc(r.name)}</p>`:'<p class="mu sm" style="margin-top:8px">Upload a file, or paste your resume text below for analysis.</p>'}<label>Resume text (used for analysis)</label><textarea id="rt" rows="6" placeholder="Paste resume text here">${esc(r?r.text:'')}</textarea><button class="btn g" style="margin-top:8px" onclick="saveTxt()">Analyse resume</button></div>`;
if(!r||!r.text){return h+`<div class="card mu">Nothing to analyse yet. Paste text above or upload a .txt file to see missing sections, skills and keywords for ${c.t}.</div>`}
const t=r.text.toLowerCase(),secs=[['Summary',/summary|objective|profile/],['Education',/education|b\.?tech|b\.?e\b|b\.?com|degree/],['Skills',/skills/],['Experience',/experience|intern|work history/],['Projects',/project/],['Contact details',/@|\+?\d{10}/]],miss=secs.filter(s=>!s[1].test(t)).map(s=>s[0]),k=resumeKw(p,c),pskills=p.skills.filter(s=>!t.includes(s.n.toLowerCase().split(' (')[0]));
const ext=[];const em=r.text.match(/[\w.+-]+@[\w-]+\.[\w.]+/);if(em)ext.push('Email: '+em[0]);ext.push('Words: '+r.text.split(/\s+/).filter(Boolean).length);
return h+`<div class="two"><div class="card"><h3>Alignment with ${c.t}</h3><p class="sm">${k.hit.length} of ${k.hit.length+k.miss.length} target keywords found</p><div class="bar"><i style="width:${k.hit.length/(k.hit.length+k.miss.length)*100}%"></i></div><p class="sm" style="margin-top:10px"><b>Found:</b> ${k.hit.map(x=>tg(x,'ok')).join('')||'None'}</p><p class="sm"><b>Missing keywords:</b> ${k.miss.map(x=>tg(x,'no')).join('')||'None'}</p></div><div class="card"><h3>Extracted information</h3>${ext.map(e=>`<p class="sm">${esc(e)}</p>`).join('')}<h3 style="margin-top:12px">Missing sections</h3>${miss.map(x=>tg(x,'no')).join('')||'<p class="sm mu">All common sections present.</p>'}</div></div>
<div class="card"><h3>Improvement recommendations</h3>${pskills.length?`<p class="sm">• Your profile lists skills that do not appear in your resume: ${pskills.map(s=>s.n).slice(0,5).join(', ')}.</p>`:''}<p class="sm">• Add evidence for: ${c.proj[0]}.</p><p class="sm">• Lead with ${Object.keys(c.req).slice(0,3).join(', ')} in your skills section for ${c.t} roles.</p>${k.miss.length?`<p class="sm">• Only add keywords you can support in interviews: ${k.miss.slice(0,3).join(', ')}.</p>`:''}<p class="sm">• Describe results with numbers where you can (quantities, time saved, scale).</p></div>`}
function upRes(f){if(!f)return;const done=t=>{S.p.resume={name:f.name,text:t,blob:null};save();render();if(!t)toast('File added. Paste text to enable analysis')};if(/\.(txt|md)$/i.test(f.name)){const r=new FileReader();r.onload=()=>done(r.result);r.readAsText(f)}else done('')}
function saveTxt(){const t=$('rt').value;if(!t.trim()){toast('Paste resume text first');return}S.p.resume={name:(S.p.resume&&S.p.resume.name)||'Pasted resume.txt',text:t};save();render()}
function viewRes(){$('ov').innerHTML=`<div class="ov" onclick="if(event.target===this)$('ov').innerHTML=''"><div class="card"><div class="row sp"><h3>${esc(S.p.resume.name)}</h3><button class="btn g" onclick="$('ov').innerHTML=''">Close</button></div><pre style="white-space:pre-wrap;font:inherit" class="sm">${esc(S.p.resume.text||'No text stored for this file.')}</pre></div></div>`}
function dlRes(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([S.p.resume.text||''],{type:'text/plain'}));a.download=S.p.resume.name.replace(/\.\w+$/,'')+'.txt';a.click()}

function hsh(s){let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return h}
function getInterviewQuestions({educationField:f,career:c,round:r,difficulty:d}){const all=[...c.qs.map(q=>[c,q]),...Object.values(CR).filter(x=>x.f.includes(f)&&x.id!==c.id).flatMap(x=>x.qs.map(q=>[x,q]))];let pool=all.filter(a=>a[1][2]===d);pool=pool.concat(all.filter(a=>a[1][2]!==d));const off=((r-1)*3)%pool.length,seen=new Set();return Array.from({length:Math.min(5,pool.length)},(_,i)=>pool[(off+i)%pool.length][1]).filter(q=>!seen.has(q[0])&&seen.add(q[0])).map(q=>{const w=[...new Set(all.map(a=>a[1][3]).filter(x=>x!==q[3]))].sort((a,b)=>hsh(a+q[0])-hsh(b+q[0])).slice(0,3),o=[q[3],...w].sort((a,b)=>hsh(a+q[0]+'x')-hsh(b+q[0]+'x'));return{q:q[0],topic:q[1],opts:o,ans:o.indexOf(q[3]),why:q[3]}})}
function startRound(r){const c=target(S.p),d=S.iv.d||'Medium';const qs=getInterviewQuestions({educationField:S.p.field,career:c,round:r,difficulty:d});if(!qs.length){toast('No questions available for this career yet');return}S.run={c:c.id,r,d,qs,i:0,a:[],sel:null,ck:false};render()}
function pickOpt(k){if(S.run&&!S.run.ck){S.run.sel=k;render()}}
function submitAns(){const R=S.run;if(R.sel==null){toast('Select an answer first');return}R.ck=true;R.a[R.i]=R.sel;render()}
function nextQ(){const R=S.run;R.i++;R.sel=null;R.ck=false;if(R.i>=R.qs.length){const ok=R.qs.filter((q,i)=>R.a[i]===q.ans).length;S.p.iv[R.c+':'+R.r]={ok,total:R.qs.length,d:R.d,weak:[...new Set(R.qs.filter((q,i)=>R.a[i]!==q.ans).map(q=>q.topic))]};save()}render()}
function interview(){const p=S.p,c=target(p);if(!c)return'<h1>Interview preparation</h1>'+nocareer('Choose a career from Careers to begin interview preparation.');p.iv=p.iv||{};const R=S.run&&S.run.c===c.id?S.run:null;
if(R&&R.i>=R.qs.length){const x=p.iv[c.id+':'+R.r];return`<h1>Round ${R.r} results</h1><div class="card"><h2>${x.ok} / ${x.total} correct</h2><p class="sm">Incorrect: ${x.total-x.ok} · Accuracy ${Math.round(x.ok/x.total*100)}%</p><p class="sm">Weak topics: ${x.weak.join(', ')||'None'}</p><p class="sm">${x.weak.length?'Review '+x.weak[0]+' and retake this round.':'Good result. Continue to the next round.'}</p><button class="btn" onclick="S.run=null;render()">Back to rounds</button></div>`}
if(R){const q=R.qs[R.i];return`<h1>Round ${R.r}: ${RN[R.r-1]}</h1><p class="mu sm">${R.d} · Question ${R.i+1} of ${R.qs.length}</p><div class="card"><b>${esc(q.q)}</b>${q.opts.map((o,k)=>{const g=R.ck&&k===q.ans,b=R.ck&&k===R.sel&&k!==q.ans;return`<button class="btn g" aria-pressed="${R.sel===k}" style="display:block;width:100%;text-align:left;margin-top:8px;font-weight:400;${g?'border-color:var(--ok)':b?'border-color:var(--bad)':R.sel===k?'border-color:var(--ac)':''}" onclick="pickOpt(${k})">${'ABCD'[k]}. ${esc(o)}</button>`}).join('')}${R.ck?`<p class="sm" style="margin-top:12px;color:${R.sel===q.ans?'var(--ok)':'var(--bad)'}"><b>${R.sel===q.ans?'Correct':'Incorrect'}</b></p><p class="sm">${esc(q.why)}</p><button class="btn" onclick="nextQ()">${R.i+1>=R.qs.length?'Finish round':'Next question'}</button>`:`<button class="btn" style="margin-top:12px" onclick="submitAns()">Submit answer</button>`}</div>`}
const n=[1,2,3,4,5].filter(r=>p.iv[c.id+':'+r]).length;
return`<h1>Interview preparation</h1><p class="mu">${c.t} · ${n} / 5 rounds completed</p><div class="card"><label for="dsel">Difficulty for the next round</label><select id="dsel" onchange="S.iv.d=this.value">${['Easy','Medium','Hard'].map(x=>`<option ${(S.iv.d||'Medium')===x?'selected':''}>${x}</option>`).join('')}</select></div>${[1,2,3,4,5].map(r=>{const x=p.iv[c.id+':'+r];return`<div class="card row sp"><div><b>Round ${r}: ${RN[r-1]}</b><p class="sm mu">${x?x.ok+' / '+x.total+' correct ('+x.d+')':'Not attempted'}</p></div><button class="btn ${x?'g':''}" onclick="startRound(${r})">${x?'Retake':'Start round'}</button></div>`}).join('')}`}
function togDone(k){S.p.done[k]?delete S.p.done[k]:S.p.done[k]=1;save();render()}

function snapshot(p,c){const rk=ranked(p);return{rd:readiness(p,c),rk,m:fit(p,c)}}
function whatif(){const p=S.p,w=S.wi,all=EDU[p.field].skl.filter(n=>lvOf(p,n)<4);if(!w.skill||!all.includes(w.skill))w.skill=all[0]||'';const cur=target(p);if(!cur)return'<h1>What If</h1>'+nocareer('Choose a career from Careers to run scenarios against it.');
let h=`<h1>What If</h1><p class="mu">Test a change and compare it with your current path. Results show alignment and readiness only, not salary or hiring outcomes.</p><div class="card"><label>Scenario</label><select onchange="S.wi.t=this.value;render()">${[['skill','Learn or improve a skill'],['career','Switch target career'],['intern','Complete an internship']].map(([k,n])=>`<option value="${k}" ${w.t===k?'selected':''}>${n}</option>`).join('')}</select>`;
if(w.t==='skill')h+=`<div class="row"><div style="flex:2"><label>Skill</label><select onchange="S.wi.skill=this.value">${all.map(n=>`<option ${w.skill===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div style="flex:1"><label>Reach level</label><select onchange="S.wi.lv=+this.value">${[1,2,3,4].map(l=>`<option value="${l}" ${w.lv===l?'selected':''}>${LV[l]}</option>`).join('')}</select></div></div>`;
if(w.t==='career')h+=`<label>Career</label><select onchange="S.wi.career=this.value">${careersFor(p).map(c=>`<option value="${c.id}" ${(w.career||'')===c.id?'selected':''}>${c.t}</option>`).join('')}</select>`;
h+=`<button class="btn" style="margin-top:14px" onclick="S.wi.run=1;render()">Run scenario</button></div>`;if(!w.run)return h;
const q=JSON.parse(JSON.stringify(p));let ch='',nc=cur;if(w.t==='skill'){const e=q.skills.find(s=>s.n===w.skill);e?e.l=Math.max(e.l,w.lv):q.skills.push({n:w.skill,l:w.lv,c:SK[w.skill]||'Technical Skills'});ch=`Reach ${LV[w.lv]} in ${w.skill}`}else if(w.t==='career'){nc=CR[w.career||careersFor(p)[0].id];q.target=nc.id;ch='Switch target to '+nc.t}else{q.exp=(+q.exp||0)+1;ch='Complete one internship (+1 year relevant experience)'}
const a=snapshot(p,cur),b=snapshot(q,nc);const d=b.rd.total-a.rd.total;
return h+`<div class="three"><div class="card"><h3>Current profile</h3><p class="sm">${cur.t}</p><h2>${a.rd.total}%</h2><p class="mu sm">readiness</p></div><div class="card" style="text-align:center"><h3>Change</h3><p class="sm">${esc(ch)}</p></div><div class="card"><h3>New profile impact</h3><p class="sm">${nc.t}</p><h2 style="color:var(--ac)">${b.rd.total}% <span class="sm">(${d>=0?'+':''}${d})</span></h2></div></div>
<div class="two"><div class="card"><h3>Current path</h3>${a.rk.slice(0,4).map(x=>`<p class="sm">${x.c.t}: ${x.m.label} (${x.m.s})</p>`).join('')}<p class="sm mu">Gaps: ${a.m.gap.map(g=>g.n).join(', ')||'none'}</p></div><div class="card"><h3>What-if path</h3>${b.rk.slice(0,4).map(x=>{const o=a.rk.find(y=>y.c.id===x.c.id).m.s;return`<p class="sm">${x.c.t}: ${x.m.label} (${x.m.s}) <span style="color:${x.m.s>o?'var(--ok)':'var(--mu)'}">${x.m.s>o?'+'+(x.m.s-o):'no change'}</span></p>`}).join('')}<p class="sm mu">Gaps: ${b.m.gap.map(g=>g.n).join(', ')||'none'}</p></div></div>
<div class="card"><h3>New opportunities and next steps</h3>${(()=>{const n=JOBS.filter(j=>CR[j.c].f.includes(p.field)&&fit(q,CR[j.c]).s>fit(p,CR[j.c]).s).length;return`<p class="sm">${n} sample roles gain alignment under this scenario.</p>`})()}${nextSteps(q,nc).map(s=>`<div class="step"><div class="dot"></div><div class="sm">${esc(s)}</div></div>`).join('')}</div>`}

function advisor(){const sug=['What careers can I pursue with my degree?','What should I learn in the next 3 months?','Which skills am I missing?','Am I ready for this role?','How can I improve my resume?','What jobs should I target?','Compare my top two careers'];
return`<h1>Career Advisor</h1><p class="mu">Answers use your profile, skills and target career.</p><div class="card"><div class="chat" id="ch">${S.chat.length?S.chat.map(m=>`<div class="m ${m.r}">${esc(m.t)}</div>`).join(''):'<p class="mu">Ask a question or pick a suggestion below.</p>'}</div><div class="row" style="margin:10px 0">${sug.map(s=>`<button class="btn g sm" onclick='ask(${JSON.stringify(s)})'>${s}</button>`).join('')}</div><div class="row"><div style="flex:1;min-width:0"><input id="ci" placeholder="Ask about careers, skills, resume, jobs…" onkeydown="if(event.key==='Enter')ask()"></div><button class="btn" onclick="ask()">Send</button></div></div>`}
function ask(q){q=q||$('ci').value.trim();if(!q)return;S.chat.push({r:'u',t:q});S.chat.push({r:'b',t:'Thinking…'});render();const ch=$('ch');ch.scrollTop=ch.scrollHeight;setTimeout(()=>{S.chat[S.chat.length-1].t=reply(q);render();const c=$('ch');c.scrollTop=c.scrollHeight},700)}
function reply(q){const p=S.p,t=q.toLowerCase(),c=target(p)||ranked(p)[0].c,m=fit(p,c),r=ranked(p),L=x=>x.map(g=>'• '+g).join('\n');
if(/compare|vs|versus/.test(t)){const f=r.find(x=>t.includes(x.c.t.toLowerCase().split(' ')[0])&&x.c.id!==r[0].c.id)||r[1],a=r[0],b=f;return`${a.c.t} vs ${b.c.t}\n\n${a.c.t}: ${a.m.label}. Skills to develop: ${a.m.gap.map(g=>g.n).join(', ')||'none'}.\n${b.c.t}: ${b.m.label}. Skills to develop: ${b.m.gap.map(g=>g.n).join(', ')||'none'}.\n\nThe path with fewer gaps is faster to reach; choose the other if its day-to-day work interests you more.`}
if(/career|degree|pursue/.test(t)&&!/resume/.test(t))return`With ${p.degree} in ${EDU[p.field].n}, your strongest options are:\n`+L(r.slice(0,4).map(x=>`${x.c.t} — ${x.m.label}`))+`\n\nOpen Careers to see why each fits.`;
if(/3 months|learn|next|missing|gap|skill/.test(t)){const g=m.gap.sort((a,b)=>(b.need-b.has)-(a.need-a.has));return g.length?`For ${c.t}, your priorities are:\n`+L(g.slice(0,4).map(x=>x.has?`${x.n}: move from ${LV[x.has]} to ${LV[x.need]}`:`${x.n}: start from the basics`))+`\n\nSuggested 3-month plan: month 1 on the first item, month 2 on the second, month 3 on a project such as "${c.proj[0]}".`:`You meet the core skills for ${c.t}. Spend the next 3 months on "${c.proj[0]}" and interview practice.`}
if(/ready|readiness/.test(t)){const d=readiness(p,c);return`Your readiness for ${c.t} is ${d.total}%.\n`+L(d.parts.map(x=>`${x[0]}: ${x[1]}/${x[2]}`))+`\n\nNext milestone: ${nextSteps(p,c)[0]}.`}
if(/resume|cv/.test(t)){if(!p.resume||!p.resume.text)return`You have not added a resume yet. Add one in Resume and I will check it against ${c.t} keywords.`;const k=resumeKw(p,c);return`For ${c.t}, your resume is missing: ${k.miss.join(', ')||'no key terms'}. Add only those you can back up with a project or experience.`}
if(/job|apply|target/.test(t)){const j=jobsFor(p).slice(0,3);return`Roles to target now:\n`+L(j.map(x=>`${x.title} (${x.loc}) — ${x.m.label}`))+`\n\nThese are sample listings; filter by location in Jobs.`}
if(/interview/.test(t))return`For ${c.t}, practise: ${[...new Set(c.qs.map(q=>q[1]))].join(', ')}. Open Interview for questions with answer guidance.`;
return`${target(p)?'Your chosen career is':'Top match (no career chosen yet):'} ${c.t} (${m.label}). Skills to develop: ${m.gap.map(g=>g.n).join(', ')||'none'}. You can ask about careers, skills to learn, readiness, your resume, or jobs.`}

function profile(){const p=S.p,f=EDU[p.field];return`<h1>Profile</h1><div class="card"><div class="two"><div><label>Name</label><input id="p_name" value="${esc(p.name)}"></div><div><label>Education field</label><select id="p_field">${Object.entries(EDU).map(([k,e])=>`<option value="${k}" ${p.field===k?'selected':''}>${e.n}</option>`).join('')}</select></div><div><label>Degree</label><input id="p_deg" value="${esc(p.degree)}"></div><div><label>Specialization</label><input id="p_spec" value="${esc(p.spec)}"></div><div><label>Level</label><select id="p_level">${['Student','Fresher','Professional'].map(x=>`<option ${p.level===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>${p.level==='Professional'?'Previous role':'Year / graduation'}</label><input id="p_year" value="${esc(p.level==='Professional'?p.prior:p.year)}"></div><div><label>Years of experience</label><input id="p_exp" type="number" min="0" value="${p.exp}"></div><div><label>CGPA / percentage</label><input id="p_score" value="${esc(p.score)}"></div><div><label>Preferred location</label><select id="p_loc">${LOCS.map(x=>`<option ${p.loc===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Preferred work type</label><select id="p_work">${['Full-time','Internship','Remote / hybrid','Freelance'].map(x=>`<option ${p.work===x?'selected':''}>${x}</option>`).join('')}</select></div></div><label>Interests</label><input id="p_int" value="${esc(p.interests)}"><label>Career goals</label><textarea id="p_goal" rows="3">${esc(p.goal)}</textarea><div class="row" style="margin-top:14px"><button class="btn" onclick="saveProf()">Save changes</button><button class="btn g" onclick="resetAll()">Reset and start over</button></div></div><div class="card"><h3>Skills</h3>${p.skills.map(s=>tg(s.n+' · '+LV[s.l])).join('')||'<span class="mu sm">None yet</span>'}<div style="margin-top:10px"><button class="btn g" onclick="go('skills')">Edit skills</button></div></div>`}
function saveProf(){const p=S.p,g=id=>$(id).value,nf=g('p_field');p.name=g('p_name').trim()||p.name;p.degree=g('p_deg');p.spec=g('p_spec');p.level=g('p_level');if(p.level==='Professional')p.prior=g('p_year');else p.year=g('p_year');p.exp=+g('p_exp')||0;p.score=g('p_score');p.loc=g('p_loc');p.work=g('p_work');p.interests=g('p_int');p.goal=g('p_goal');if(nf!==p.field){p.field=nf;p.target='';S.sel=null;S.run=null;S.job=null;S.iv={};S.wi={t:'skill',skill:'',lv:2,career:''};S.chat=[]}save();render();toast('Profile updated')}
function resetAll(){$('ov').innerHTML=`<div class="ov" role="dialog" aria-modal="true" onclick="if(event.target===this)closeOv()"><div class="card"><h3>Start over?</h3><p class="sm mu">This will clear your current profile, skills, selected career, interview progress and preferences.</p><div class="row"><button class="btn g" onclick="closeOv()">Cancel</button><button class="btn" onclick="resetApplicationState()">Reset Everything</button></div></div></div>`}
function closeOv(){$('ov').innerHTML=''}
function resetApplicationState(){try{localStorage.removeItem('pw1')}catch(e){}S.p=null;S.ob={step:0,level:'Student',field:'',skills:{}};S.chat=[];S.sel=null;S.job=null;S.run=null;S.jf={q:'',loc:'',type:'',exp:''};S.iv={};S.v='home';closeOv();render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOv()});if(window.addEventListener)window.addEventListener('load',()=>{try{mount3d()}catch(e){}});render();
</script></body></html>
